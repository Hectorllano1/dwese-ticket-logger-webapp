
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head (#{msg.region.title})"></head>

<body>

<!-- Incluir el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">

    <!-- Título -->
    <h1 th:text="#{msg.region.title}">
        Listado de Comunidades Autónomas
    </h1>

    <!-- Mensaje de error -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Tabla de regiones -->
    <table class="table table-bordered mt-3">

        <thead>
        <tr>
            <th th:text="#{msg.region.id}">ID</th>
            <th th:text="#{msg.region.code}">Código</th>
            <th th:text="#{msg.region.name}">Nombre</th>
            <th th:text="#{msg.region.actions}">Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="region : ${listRegions}">

            <td th:text="${region.id}"></td>
            <td th:text="${region.code}"></td>
            <td th:text="${region.name}"></td>

            <td>

                <!-- Botón para editar -->
                <a th:href="@{/regions/edit(id=${region.id})}"
                   class="btn btn-primary btn-sm"
                   th:text="#{msg.region.edit}">
                    Editar
                </a>

                <!-- Botón para eliminar -->
                <form th:action="@{/regions/delete}"
                      method="post"
                      class="d-inline">

                    <input type="hidden"
                           name="id"
                           th:value="${region.id}"/>

                    <button type="submit"
                            class="btn btn-danger btn-sm"
                            th:onclick="|return confirm('#{msg.region.confirm}');|"
                            th:text="#{msg.region.delete}">
                        Eliminar
                    </button>

                </form>

            </td>
        </tr>
        </tbody>

    </table>

    <!-- Botón para añadir una nueva región -->
    <a th:href="@{/regions/new}"
       class="btn btn-success mt-3"
       th:text="#{msg.region.add}">
        Agregar Nueva Comunidad Autónoma
    </a>

    <!-- Volver a la página principal -->
    <a th:href="@{/}"
       class="btn btn-secondary mt-3"
       th:text="#{msg.region.back.home}">
        Volver al inicio
    </a>

</main>

<!-- Incluir el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
